org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# kaptDebugKotlin was crashing with a bare "InvocationTargetException (no error message)" -
# a known symptom of kapt's out-of-process worker running out of heap on its own default JVM
# args. Running it in-process (sharing the Kotlin daemon's heap) avoids that.
kapt.workers.isolation=none
