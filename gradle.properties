org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# kapt's default (K1-based) stub generator can't read Kotlin metadata emitted by the K2
# compiler for some classes (e.g. @HiltWorker CoroutineWorker subclasses), failing with
# "Unable to read Kotlin metadata due to unsupported metadata kind: null". kapt's K2-based
# stub generator handles this correctly.
kapt.use.k2=true
