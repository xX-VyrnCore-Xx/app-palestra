# JVM tuning: 4 GB heap on the Parallel GC is the sweet spot for Android builds -
# enough for Hilt/KSP/Room codegen without swapping, and ParallelGC has lower
# overhead than G1 for short-lived build processes.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Build both modules (and every variant task) in parallel.
org.gradle.parallel=true

# Reuse task outputs across builds: a task reruns only if its inputs actually changed.
org.gradle.caching=true

# Reuse the configuration phase output; big win because Hilt/KSP plugins are slow to configure.
org.gradle.configuration-cache=true

# Default is true since Gradle 4.6; explicit here so it survives Gradle upgrades.
org.gradle.vfs.watch=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
