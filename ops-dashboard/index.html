<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ViBE Ops &middot; Accesso</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f0f14; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #f5f5f7;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px; padding: 36px 28px; background: #17171f; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .brand { font-size: 24px; font-weight: 800; color: #f76b15; letter-spacing: -0.5px; margin: 0 0 6px; }
  .subtitle { font-size: 13px; color: #8a8a95; margin: 0 0 28px; text-transform: uppercase; letter-spacing: 0.08em; }
  label { display: block; font-size: 13px; color: #c8c8d0; margin-bottom: 6px; }
  input {
    width: 100%; padding: 13px 14px; margin-bottom: 16px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14); background: #0f0f14; color: #f5f5f7; font-size: 15px;
  }
  input:focus { outline: none; border-color: #f76b15; }
  button {
    width: 100%; padding: 14px; border: none; border-radius: 10px; background: #f76b15; color: #fff;
    font-weight: 700; font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { font-size: 13px; margin-top: 14px; min-height: 18px; color: #ff5c6c; }
  .note { font-size: 12px; color: #5a5a63; margin-top: 24px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <p class="brand">ViBE Ops</p>
    <p class="subtitle">Monitoraggio infrastruttura</p>
    <form id="form">
      <label for="pw">Password demo</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus />
      <button id="submit" type="submit">Accedi</button>
      <div id="msg" class="msg"></div>
    </form>
    <p class="note">
      Sola lettura: spazio database, storage, pulizia automatica e stato del progetto.
      Nessun dato personale degli utenti reali è visibile da qui.
    </p>
  </div>
  <script>
    var form = document.getElementById("form");
    var msg = document.getElementById("msg");
    var submitBtn = document.getElementById("submit");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var pw = document.getElementById("pw").value;
      msg.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Accesso...";
      fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw }),
      })
        .then(function (res) {
          if (!res.ok) throw new Error("bad credentials");
          window.location.href = "/dashboard.html";
        })
        .catch(function () {
          msg.textContent = "Password errata.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Accedi";
        });
    });
  </script>
</body>
</html>
