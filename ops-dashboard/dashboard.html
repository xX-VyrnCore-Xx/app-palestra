<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ViBE Ops &middot; Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0f0f14; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #f5f5f7; padding: 24px 16px 60px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .brand { font-size: 22px; font-weight: 800; color: #f76b15; letter-spacing: -0.5px; margin: 0; }
  .subtitle { font-size: 12px; color: #8a8a95; text-transform: uppercase; letter-spacing: 0.08em; margin: 2px 0 0; }
  .logout {
    background: transparent; border: 1px solid rgba(255,255,255,0.14); color: #c8c8d0;
    padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .warnings { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
  .warning {
    padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.5;
    border: 1px solid rgba(255,193,7,0.35); background: rgba(255,193,7,0.08); color: #ffd166;
  }
  .warning.critical { border-color: rgba(255,92,108,0.4); background: rgba(255,92,108,0.1); color: #ff8a95; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card {
    padding: 18px; background: #17171f; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);
  }
  .card .label { font-size: 12px; color: #8a8a95; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 8px; }
  .card .value { font-size: 26px; font-weight: 800; margin: 0; }
  .card .sub { font-size: 12px; color: #6a6a73; margin: 4px 0 0; }
  .bar-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; background: #f76b15; transition: width 0.3s; }
  .bar-fill.warn { background: #ffd166; }
  .bar-fill.critical { background: #ff5c6c; }
  section { margin-bottom: 24px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a8a95; margin: 0 0 12px; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .muted { color: #8a8a95; }
  .loading, .error { text-align: center; color: #8a8a95; padding: 60px 0; }
  .error { color: #ff8a95; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="brand">ViBE Ops</p>
        <p class="subtitle">Monitoraggio infrastruttura</p>
      </div>
      <button class="logout" id="logout">Esci</button>
    </header>
    <div id="content"><div class="loading">Caricamento...</div></div>
  </div>
  <script>
    function fmtBytes(bytes) {
      if (bytes < 1024) return bytes + " B";
      var units = ["KB", "MB", "GB"];
      var val = bytes;
      var i = -1;
      do { val /= 1024; i++; } while (val >= 1024 && i < units.length - 1);
      return val.toFixed(1) + " " + units[i];
    }
    function barClass(ratio) {
      if (ratio >= 0.9) return "bar-fill critical";
      if (ratio >= 0.7) return "bar-fill warn";
      return "bar-fill";
    }
    function timeAgo(iso) {
      var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (mins < 1) return "adesso";
      if (mins === 1) return "1 minuto fa";
      if (mins < 60) return mins + " minuti fa";
      return Math.round(mins / 60) + " ore fa";
    }

    function render(stats) {
      var warningsHtml = (stats.warnings || []).map(function (w) {
        return '<div class="warning ' + (w.level === "critical" ? "critical" : "") + '">' + w.message + "</div>";
      }).join("");

      var html = "";
      if (warningsHtml) html += '<div class="warnings">' + warningsHtml + "</div>";

      html += '<div class="grid">';
      html += card("Database", fmtBytes(stats.db_size_bytes), "di 500 MB (free tier)", stats.db_usage_ratio);
      html += card("Storage file", fmtBytes(stats.storage_size_bytes), "di 1 GB (free tier)", stats.storage_usage_ratio);
      html += '</div>';

      html += "<section><h2>Utenti</h2><div class='card'>";
      html += rowLine("Profili totali", stats.profiles_count);
      html += rowLine("Personal Trainer", stats.pt_count);
      html += rowLine("Allievi", stats.allievo_count);
      html += "</div></section>";

      html += "<section><h2>Attività</h2><div class='card'>";
      html += rowLine("Allenamenti registrati", stats.workout_sessions_count);
      html += rowLine("Schede create", stats.workout_plans_count);
      html += rowLine("Messaggi chat", stats.messages_count);
      html += rowLine("Messaggi assistente AI", stats.ai_messages_count);
      html += "</div></section>";

      html += "<section><h2>Ultima ora</h2><div class='card'>";
      html += rowLine("Richieste assistente AI", stats.ai_requests_last_hour);
      html += rowLine("Richieste reset password", stats.password_reset_requests_last_hour);
      html += "</div></section>";

      html += '<p class="muted" style="font-size:12px;text-align:center">Statistiche aggiornate ' + timeAgo(stats.computed_at) + ' (cache rinfrescata ogni 15 minuti da un job pg_cron)</p>';

      document.getElementById("content").innerHTML = html;
    }

    function card(label, value, sub, ratio) {
      var bar = ratio !== undefined
        ? '<div class="bar-track"><div class="' + barClass(ratio) + '" style="width:' + Math.min(100, ratio * 100) + '%"></div></div>'
        : "";
      return '<div class="card"><p class="label">' + label + '</p><p class="value">' + value + '</p><p class="sub">' + sub + '</p>' + bar + '</div>';
    }
    function rowLine(label, value) {
      return '<div class="row"><span class="muted">' + label + '</span><strong>' + value + '</strong></div>';
    }

    function load() {
      fetch("/api/stats")
        .then(function (res) {
          if (res.status === 401) { window.location.href = "/"; return null; }
          if (!res.ok) throw new Error("bad response");
          return res.json();
        })
        .then(function (stats) { if (stats) render(stats); })
        .catch(function () {
          document.getElementById("content").innerHTML = '<div class="error">Impossibile caricare le statistiche.</div>';
        });
    }

    document.getElementById("logout").addEventListener("click", function () {
      fetch("/api/logout", { method: "POST" }).then(function () { window.location.href = "/"; });
    });

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
